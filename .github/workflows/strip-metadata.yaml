# .github/workflows/strip-metadata.yml
name: Strip Image Metadata

on:
  pull_request:
    paths: ['**.jpg', '**.jpeg', '**.png', '**.webp']

permissions:
  contents: write

jobs:
  strip-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: ICXCNIKAanon/metastrip@v1
        with:
          path: 'content/'
          commit: 'true'

      - name: Push changes
        run: git push